[APU]
ffmpeg_verbose = false                            	# Verbose FFmpeg output (debug and above)


[CPU]
break_condition_gpr = -1                          	# GPR compared to
break_condition_op = "eq"                         	# comparison operator
break_condition_truncate = true                   	# truncate value to 32-bits
break_condition_value = 0                         	# value compared against
break_on_debugbreak = true                        	# int3 on JITed __debugbreak requests.
break_on_instruction = 0                          	# int3 before the given guest address is executed.
break_on_start = false                            	# Break into the debugger on startup.
break_on_unimplemented_instructions = true        	# Break to the host debugger (or crash if no debugger attached) if an unimplemented PowerPC instruction is encountered.
clock_no_scaling = false                          	# Disable scaling code. Time management and locking is bypassed. Guest system time is directly pulled from host.
clock_source_raw = false                          	# Use the RDTSC instruction as the time source. Host CPU must support invariant TSC.
cpu = "any"                                       	# CPU backend [any, x64].
debugprint_trap_log = false                       	# Log debugprint traps to the active debugger
disable_global_lock = false                       	# Disables global lock usage in guest code. Does not affect host code.
disassemble_functions = false                     	# Disassemble functions during generation.
emit_source_annotations = false                   	# Add extra movs and nops to make disassembly easier to read.
fault_spin_limit = 4096                           	# Abort after this many consecutive identical recovered host faults (same rip+address, no progress). 0 = disabled.
ignore_undefined_externs = true                   	# Don't exit when an undefined extern is called.
inline_mmio_access = true                         	# Inline constant MMIO loads and stores.
load_module_map = ""                              	# Loads a .map for symbol names and to diff with the generated symbol database.
milo_trace_call_effects = false                   	# milo-trace (X8-CE): emit capture thunks for ALL functions so a traced frame's forward calls get their return regs + write delta captured into the parent's CALLS[] oracle. Requires --milo_trace_enable=true. OFF => byte-identical X7 translation.
milo_trace_enable = false                         	# milo-trace: open a capture session at title launch (X-track). Requires --milo_trace_out. Emits per-call .mtr records via the GuestFunction::Call override-wrap hook.
milo_trace_exact_mem = false                      	# milo-trace: opt into EXACT memory capture (wider Tier-B chase + Tier-C access log). Heavier; use with a gated manifest. Requires --milo_trace_enable=true.
milo_trace_manifest = ""                          	# milo-trace: path to the JSON address manifest (traced addresses + per-addr mem windows). Empty => trace every guest call.
milo_trace_out = ""                               	# milo-trace: output .mtr path. Ignored unless --milo_trace_enable=true.
pe_override = ""                                  	# Path to a PE file to override the loaded XEX image. The PE sections will be copied over the original XEX's PE content.
pvr = 7407360                                     	# Processor version and revision number.
                                                  	# Bits 0 to 15 are the version number.
                                                  	# Bits 16 to 31 are the revision number.
                                                  	# Note: Some XEXs (such as mfgbootlauncher.xex) may check for a value that's less than 0x710700.

rb3_loadmgr_unbudget = false                      	# RB3 TU5/DX (title 0x45410914), default off, requires --rb3dx_ui_probe: poke TheLoadMgr's per-frame Poll() time budget (the 10.0f period/split pair at 0x82E06E48/4C) to 1e30 -- the value the game itself uses inside PollUntilEmpty() for unbudgeted synchronous drains. Under Checked-config xenia a budgeted Poll() pass can exhaust its 10ms before the front loader's first state step (DirLoader::PollLoading checks CheckSplit() BEFORE advancing), starving the front loader forever: the clean-TU5 boot freeze at the char-cache extras milos. Guest-data poke only; no code patches. Title-gated => DC3-inert.
rb3_mogg_key_table = ""                           	# RB3 TU5 (title 0x45410914), default empty (disabled): 64 hex bytes to write over the mogg key-encryption table at 0x82C76258. Retail RB3 decrypts .mogg song audio by installing a table key via XeKeysSetKey and running XeKeysAesCbc. On hardware SetKey first DEOBFUSCATES the supplied key using a console key we do not have, so the shipped (obscured) table cannot work under emulation and the song stream never leaves kInit. Passing the deobscured equivalent here makes the decrypt come out right. No keys ship with xenia -- read the 64 bytes at 0x82C76258 out of an already-deobscured RB3 image if you have one. Accepts whitespace between bytes. Title-gated => DC3-inert.
rb3_no_char_preview = false                       	# RB3 TU5 (title 0x45410914), default off: no-op CharSync::UpdateCharCache (0x82564698) via a guest-function override so the band-member preview char-cache extras (world/shared/extras/male_extras0N.milo) are never queued. Those loaders sit kLoadFront at the head of the single main-thread load FIFO and, when one stalls, head-of-line-block the splash_screen panels behind them -- freezing the whole cooperative-loader frame loop ~13s into boot (clean-TU5 wedge). Byte-for-byte equivalent to the rb3 native port's RB3_NO_CHAR_PREVIEW early-return; previews are cosmetic and off the boot-to-menu path. Title-gated + default-off => DC3-inert.
rb3_overlapped_scan = false                       	# RB3 (title 0x45410914), default off, requires --rb3dx_ui_probe: scan the guest heap for OVERLAPPED structs stuck at Internal==STATUS_PENDING (0x103) to test the clean-TU5 loader-freeze hypothesis (AsyncFileWin::_ReadDone spins on an OVERLAPPED xenia never clears). Read-only. Title-gated => DC3-inert.
rb3_splash_unwedge = false                        	# RB3 TU5 (title 0x45410914), default off, requires --rb3dx_ui_probe: break the clean-TU5 boot deadlock in Splash::EndSplasher. App::App's EndSplasher calls SetImmutableState(kTerminating) which no-ops when a Suspend is in-flight (mState<kResumed), then blocks in WaitForState(kTerminated) forever while the SplashThread worker is parked in WaitForState(kResuming). This finds the live Splash (tid=6 stack) and drives the state machine to completion (resume the worker, then terminate it) so App::App returns and the frame loop resumes pumping the loader. Guest-memory poke + NtSetEvent only. Title-gated => DC3-inert.
rb3_stream_census = false                         	# RB3 (title 0x45410914), default off, requires --rb3dx_ui_probe: sweep the guest heap for live StandardStream objects (vtable 0x820F6A8C) and report each one's mState(+0x14), receivers vector(+0x20..+0x24) and channel array(+0x78..+0x80). The song-audio gate is MasterAudio::IsLoaded (0x8277B6E8), which tail-calls mStream->IsReady() = (mState == kReady/2). mState is written in exactly three places: the ctor stores kInit(0), 0x82704880 stores kBuffering(1), and PollStream stores kReady(2). The kBuffering store is UNCONDITIONAL within 0x827046B8, and that same function is the only code that fills the receivers vector from the channel array -- so 'mState==0 with an empty receivers vector' is proof that 0x827046B8 was never called, rather than that it ran and failed. Finding streams by vtable instead of by walking the load queue lets this run against an image that DOES reach playback, making the two directly comparable. Read-only. Title-gated => DC3-inert.
rb3_tu5_app_run_direct = false                    	# RB3 TU5 (title 0x45410914), default off: enter the real frame loop directly. Retail App::Run (0x822703D0) installs an unhandled-exception filter (0x822703A8) and then deliberately writes to guest address 0 (`stw r10,0(0)` at 0x822703FC); on hardware the access violation invokes the filter, and the FILTER calls App::RunWithoutDebugging (0x82270080) -- the actual unconditional frame loop (SystemPoll + all subsystem polls + TheUI.Poll + Draw). Under --protect_zero=false (required for the separate 0x8275026C page-0 read) the null store succeeds silently, the filter never runs, App::Run returns, and main falls into App::~App -> clean teardown ('the flow-quit'). Byte-patch main's `bl 0x822703D0` at 0x82272E90 into `bl 0x82270080` -- the exact one-word patch the patched TU5 image (RB3DX lineage) already ships at that site. Supersedes --rb3_tu5_loop_main/--rb3_tu5_hold_main. Title-gated + default-off => DC3-inert.
rb3_tu5_hash_poke = false                         	# RB3 TU5 (title 0x45410914), default off, requires --rb3dx_ui_probe: rewrite the exe's embedded ark-integrity SHA1s for the two dtbs the clean-TU5 boot patch modifies (ui.dtb, splash.dtb) so the anti-tamper check stops silently quitting the game during App::App. Equivalent to arkhelper patchcreator's exePath hash patching, applied in guest memory. Title-gated => DC3-inert.
rb3dx_alloc_probe = false                         	# RB3DX (title 0x45410914) DIAGNOSTIC, default off: bytepatch guest MemAlloc@0x827BCD38 with an observe-and-continue trampoline that logs size/align/caller-LR + a guest stack walk for allocation sizes with a non-zero top byte (main_hub OOM corrupted-size investigation). Pure observer; no guest state is modified by the handler.
rb3dx_alloc_trace_path = ""                       	# RB3DX (title 0x45410914) DIAGNOSTIC, default off (empty): write a 32-byte binary record for EVERY guest MemAlloc@0x827BCD38 entry (tag 1: size/align/caller-LR/caller-SP), for its RETURN (tag 2: the pointer it handed back, joined by seq), and -- with --rb3dx_free_trace -- for every MemFree@0x827BC430 entry (tag 3: pointer, block header, caller-LR). Offline attribution of heap-"main" fragmentation by call site. Text logging is far too slow at the real call rate (~876 allocs/s mean, 1900/s peak); this is a buffered binary sink. Implies the __savegprlr_23 probe override. Title-gated so DC3-inert.
rb3dx_autoconfirm_p2_up = 0                       	# RB3DX autopilot: press DPAD-UP on pad 1 for the first N samples at part_difficulty_screen before the A confirms, to navigate P2's CHOOSE INSTRUMENT list off the default first-free part (e.g. 1 = select the entry above BASS -- GUITAR when the same-instrument un-grey is armed).
rb3dx_autoconfirm_parts = false                   	# RB3DX (title 0x45410914), default off, requires --rb3dx_ui_probe: closed-loop autopilot for the two-player part/difficulty confirm. Fixed-time --scripted_input presses cannot hit the part_difficulty_screen window reliably (menu/ark load times vary tens of seconds between runs; measured si6..si10). When the probe sees song_select_screen it injects A on pad 0 (advance/pick song); on part_difficulty_screen it alternates A on pad 1 / pad 0 each ~2s sample so both players confirm part and difficulty regardless of when the cards appear. Injection goes through the nop HID driver's per-pad InjectButtonPress; no guest writes. Title-gated => DC3-inert.
rb3dx_clamp_alloc = false                         	# RB3DX / RB3 TU5 (title 0x45410914), default off: mitigate the emulation-induced main_hub-load OOM race (doc-09). At MemAlloc's __savegprlr_23 call site (lr==0x827BCD40) the request size occasionally arrives as 0xGG001524 -- a correct small size in the low 24 bits with a garbage NON-ZERO top byte (an uninitialized guest read that is zero on real hardware but garbage under Xenia). When the top byte is non-zero AND the low 24 bits are < 1 MiB (the documented small-alloc signature), clamp r3 to its low 24 bits so MemHeap::Alloc gets the intended size instead of OOMing. Legit multi-MiB allocations (low-24 >= 1 MiB) are never touched. Reuses the alloc-probe __savegprlr_23 override; title-gated so DC3-inert.
rb3dx_free_trace = true                           	# RB3DX: with --rb3dx_alloc_trace_path, also trace MemFree@0x827BC430 (via an exact override of its prologue helper __savegprlr_26 @0x82829250, filter lr==0x827BC438) so allocations can be paired with their frees and block lifetimes attributed. No effect without the trace path.
rb3dx_hub_teardown_trace = false                  	# RB3DX / RB3 TU5 (title 0x45410914), default off: de-mask the periodic headless Thread Status Report so it stops attributing the main_hub stall to the benign XMA-decoder MMIO soft-fault at 0x82BCEFE4. When on (and the running title is 0x45410914), the report additionally prints the count of benign XMA-aperture [0x7FEA0000,0x7FEB0000) soft-faults and the last *non-XMA* (genuine) fault address/rip resolved to its guest function -- the field to watch for the real ~30s terminator. Read-only diagnostic; no guest state changed; title-gated so DC3-inert.
rb3dx_offline_join = false                        	# RB3DX (title 0x45410914), default off: complete the offline single-local-host user join synchronously so the boot advances past splash_screen to main_hub. Overrides guest NetSession::IsHost() @0x823CECE0 to return true for the offline case (mirrors the RB3 native port's IsHost()==true), which sends NetSession::AddLocalUser @0x823D2468 down its host branch and fires AddUserResultMsg(1) at once instead of an online request/response that never round-trips headless. Title-gated so DC3-inert.
rb3dx_ret_trace = true                            	# RB3DX: with --rb3dx_alloc_trace_path, also capture MemAlloc's RETURN VALUE (the allocated pointer -- which says where in the arena the block landed, i.e. FirstFit-bottom vs LastFit-top) by overriding the epilogue helper __restgprlr_23 @0x82829294 that MemAlloc tail-branches through, matching on (r1 == the entry SP recorded for this thread AND the about-to-be-restored LR == that call's caller LR). Set false if the epilogue override destabilises the guest; the alloc-entry trace still works without it, only pointer-exact alloc/free pairing is lost.
rb3dx_si_claim_anchor = 0                         	# RB3DX (title 0x45410914), default 0 (off), requires --rb3dx_ui_probe: guest VA of the RB3Enhanced.dll SI claim-table anchor (the lis/addi base register in SIInstallClone; wt-integration build: 0x84055FD8, decoded from the packed DLL with capstone). Layout from SameInstrumentHooks.c: gClaims[] {track,count} pairs at +0 stride 8, gImpls[] at +0xC0 stride 0xC, gClaimCount at +0x1C8, gImplCount at +0x1CC. When set, the ui probe logs these each sample -- the machine-readable twin evidence (two players on one track => a claim with count 2 and implCount 2). Read-only. Title-gated => DC3-inert.
rb3dx_skip_calibration = false                    	# RB3DX / RB3 TU5 (title 0x45410914), default off: make first-boot skip the interactive first_time_calibration -> cal_audio_screen A/V-latency calibration (uncompletable headless with null audio + fixed-time input) so the splash advances straight to main_hub. A host thread resolves the guest profile_mgr singleton via the main-dir name hash and sets ProfileMgr::mHasSeenFirstTimeCalibration @+0x54 = 1 (the splash kSplashScreen_EndOvershell condition {!{profile_mgr get_has_seen_first_time_calibration}} then routes to main_hub_screen). Single guest byte written; title-gated so DC3-inert.
rb3dx_stack_trace = true                          	# RB3DX: with --rb3dx_alloc_trace_path, also emit a tag-4 record per MemAlloc carrying the next FOUR guest return addresses above the immediate caller, walked from the stack backchain (each frame's saved LR is at [caller_sp - 8] under the __savegprlr idiom). Needed because the top allocation site is XMemAlloc -- a shim -- so the immediate caller LR names the allocator, not the subsystem. Fully range-checked; unresolvable frames are reported as 0. No effect without the trace path.
rb3dx_ui_probe = false                            	# RB3DX (title 0x45410914) DIAGNOSTIC, default off: passively sample the guest UI transition state every ~2s from a host thread (BandUI/UIManager @0x82DFD2B0: transition state + current/transition screen names, the transition screen's per-panel load states, and the saveload_mgr/net_sync objects found via ObjectDir::sMainDir @0x82E054B8). Read-only guest memory access; no hooks, no patches; title-gated so DC3-inert. For the main_hub load-stall investigation.
scanner_clamp_to_mapped_memory = true             	# Stop function-boundary detection at the end of the heap region backing the function's start address instead of reading past it. Upstream Xenia scans to the declared end address unconditionally, which dereferences unmapped host memory when a function record runs off the end of its mapping. Disabling this restores upstream behaviour (and upstream's segfault).
scanner_stop_on_invalid_run = true                	# Terminate function-boundary detection after 8 consecutive undecodable instructions with no reachable branch target beyond them. Keeps the scanner from walking megabytes of data when a /FORCE-linked decomp image puts an unresolved stub where code should be. Upstream Xenia does not do this (it ignores invalid words and keeps scanning); a legitimate function with 8+ words of embedded data -- jump tables, constant pools -- will be truncated here, so set this to false if a title's functions look short.
si_force_allow_va = 0                             	# RB3DX / RB3 TU5 (title 0x45410914), default 0 (disabled): guest VA of the from-source RB3Enhanced.dll's config.AllowSameInstrument flag (Phase-2 mapdeploy.json allowFlagVA = config base + 0x50, e.g. 0x84829590). Because --si_load_dll uses LoadUserModule(call_entry=false), the DLL's DllMain/ini load never runs, so AllowSameInstrument stays 0 and the installed SI hooks run pass-through (install verified but behaviorally inert). When non-zero, Xenia pokes 1 to this VA right after the DLL loads, arming the hook bodies. REQUIRED for behavioral (Phase-5) runs; harmless for install-only (Phase-3) verification. Title-gated + default-off => DC3-inert.
si_hook_vas = ""                                  	# RB3DX / RB3 TU5 (title 0x45410914), default empty: comma-separated FOUR from-source RB3Enhanced.dll hook VAs, in fixed site order IsActiveHook,ResolveWaitStatesHook,ProcessConfigHook,RecalcGemListHook (hex, e.g. 0x84027B88,0x84027BC8,0x84027E30,0x84028FC8). Read from the current build's K-link/RB3Enhanced.map -- the hook VAs move on EVERY DLL rebuild, so the 2026-07 kFromSrcHooks constants in approach (b) are stale the moment the DLL is relinked. When set, overrides those constants; when empty, the retired 2026-07 constants are used unchanged (only correct for the July fromsource.dll artifact). The four game-site addresses are title-side and stable. Title-gated + default-off => DC3-inert.
si_hook_verify = false                            	# RB3DX / RB3 TU5 (title 0x45410914), default off: read-only host-thread verifier for the RB3Enhanced-DLL same-instrument GAMEPLAY hooks (H1 ProcessConfig @0x8276FA08, H2 RecalcGemList @0x82794740). Samples the first instruction word at each site and decodes it: if it is a `b` (primary opcode 18) whose target lands in DLL space [0x84000000,0x84040000) and within +/-32MB of the site, the RB3E HookFunction detour is INSTALLED (PASS); if it is still the stock prologue 0x7D8802A6 (mflr r12), the DLL is not loaded / hooks not installed (NEGATIVE control). Also scans for a loaded user module based at 0x84000000. Read-only, no writes; title-gated so DC3-inert. Works regardless of HOW the DLL got mapped: verified control matrix (2026-07-09) -- stock TU5 reads 0x7D8802A6 (mflr r12); the dead static-.data-cave build reads a b into 0x82C8xxxx (correctly flagged NON-DLL); the RB3Enhanced.dll build must read a b into [0x84000000,0x84040000) = PASS. To load the DLL in Xenia, KernelState::LoadUserModule("game:\\RB3Enhanced.dll") maps it at its preferred base 0x84000000 and runs its entry (a --si_load_dll cvar wiring this is the next harness step, pending the packed DLL artifact).
si_init_va = 0                                    	# RB3DX / RB3 TU5 (title 0x45410914), default 0 (disabled): guest VA of the from-source RB3Enhanced.dll's InitSameInstrument() entry (void)(void), taken from the DLL's link map (Phase-2 mapdeploy.json initVA, e.g. 0x84019830). When --si_load_dll is set and this is non-zero, Xenia does NOT host-emulate the four HookFunction detours with hardcoded old-DLL targets; instead it calls InitSameInstrument on the live boot guest-thread (via the __savegprlr_23 override + full register snapshot/restore), so the DLL's own HookFunction computes the detour targets and rewrites the four SI game sites. This is the from-source-DLL path -- addresses come from the DLL, not constants. Title-gated + default-off => DC3-inert.
si_load_dll = false                               	# RB3DX / RB3 TU5 (title 0x45410914), default off: load the produced RB3Enhanced.dll (game:\RB3Enhanced.dll) at its preferred base 0x84000000 via KernelState::LoadUserModule(call_entry=false), then invoke the self-contained SI hook installer InitSameInstrument @0x8402DFA8 on the live boot guest-thread (reuses the MemAlloc __savegprlr_23 override, full register snapshot/restore). InitSameInstrument's inlined RB3E HookFunction rewrites the first instruction of the four SI target sites to a `b` into DLL space -- crucially H1 PlayerTrackConfigList::ProcessConfig @0x8276FA08 (kills the vector[-1] track-number-reuse crash) and H2 TrackWatcherImpl::RecalcGemList @0x82794740 (per-watcher gem-list clone). call_entry=false deliberately skips RB3E's full CRT/DllMain boot (its socket/event init is unsafe headless); only the deterministic hook installer runs. Fires once well into boot. Pair with --si_hook_verify to observe the installed detours. Title-gated + default-off => DC3-inert.
si_probe = false                                  	# RB3DX / RB3 TU5 (title 0x45410914), default off: passively log, from a host thread, the runtime bytes of the static same-instrument (SI) patch in guest RAM -- the enable flag @0x82C8AAA0 (expect 1), the IsActive detour word @0x826684C0 (expect 0x48621BC0 = b 0x82c8a080), and the first cave-stub words @0x82C8A080 / @0x82C8A000. Read-only; proves the static XEX cave survived decrypt/load and whether a runtime writer zeroes the flag. Title-gated so DC3-inert.
si_selftest = false                               	# RB3DX / RB3 TU5 (title 0x45410914), default off: once during boot, synthetically invoke OvershellPartSelectProvider::IsActive @0x826684C0 (the same-instrument detour site) with a crafted empty `this` and log the return value, to test whether Xenia's JIT executes the .data code cave and the SI logic fires (r3==1 => cave executed + SI active; r3==0 => inert). Runs on a live guest-thread context (reuses the alloc-probe __savegprlr_23 override) with full register snapshot/restore; title-gated so DC3-inert.
soft_fault_unmapped_reads = true                  	# Decomp/stub-guest support, ON by default in this fork: a read access violation on unmapped guest memory zeroes the destination register and resumes at the next instruction instead of crashing. Upstream semantics are OFF -- the fault propagates and the emulator reports it with a PC. The first occurrences are logged at warning level either way. Turn this off to find real uninitialised-pointer and stack-overrun bugs; leave it on for the DC3 (0x373307D9) and RB3DX (0x45410914) decomp targets, which rely on it.
store_all_context_values = false                  	# Don't strip dead context stores to aid in debugging.
tolerate_null_guest_calls = true                  	# Treat a call through a null or unresolvable guest function pointer as a no-op that returns an undefined value, instead of asserting. This is a decomp-support flag: the DC3 (0x373307D9) and RB3DX (0x45410914) decomp targets are /FORCE-linked with unresolved externs and null vtable slots and cannot boot without it. UPSTREAM SEMANTICS ARE false -- for a retail title a null vtable slot means the object graph is already corrupt and the emulator should say so rather than silently continue. Turning this off restores upstream's assert_not_zero/assert_not_null and lets the null call reach the host. Diagnostics (the rate-limited ResolveFunction XELOGE) are emitted either way.
trace_function_coverage = false                   	# Generate tracing for function instruction coverage statistics.
trace_function_data = false                       	# Generate tracing for function result data.
trace_function_data_path = ""                     	# File to write trace data to.
trace_function_references = false                 	# Generate tracing for function address references.
trace_functions = false                           	# Generate tracing for function statistics.
validate_hir = false                              	# Perform validation checks on the HIR during compilation.


[Config]
defaults_date = 2020123113                        	# Do not modify - internal version of the default values in the config, for seamless updates if default value of any option is changed.


[Content]
license_mask = 0                                  	# Set license mask for activated content.
                                                  	#  0 = No licenses enabled.
                                                  	#  1 = First license enabled. Generally the full version license in
                                                  	#      Xbox Live Arcade titles.
                                                  	#  -1 or 0xFFFFFFFF = All possible licenses enabled. Generally a
                                                  	#                     bad idea, could lead to undefined behavior.


[DC3]
dc3_clean_content_cache = true                    	# DC3 (0x373307D9) only: on every launch, recursively delete the whole <content_root>/373307D9 directory before the title starts. This DESTROYS DC3 save games, profiles and downloaded content -- it is not a cache scrub, it is remove_all() on the title's entire content tree. It exists because the decomp bring-up box wants a clean slate each boot and the DC3 boot probe's 627-trap baseline assumes it. Anyone who is not doing decomp bring-up should set this to false.
dc3_crash_snapshot_path = ""                      	# DC3: optional JSON crash snapshot output path written from guest crash dumps (headless-friendly structured artifact for postmortem tools).
dc3_crt_bisect_max = -1                           	# DC3: max CRT constructor index to allow (-1=disabled/all run, 0=only index 0 runs, N=indices 0..N run). Used for binary search to find heap-corrupting constructor.
dc3_crt_skip_indices = ""                         	# DC3: comma-separated list of CRT constructor indices to nullify. Supports ranges: '69,75,98-340'. Default empty = use dc3_crt_skip_nui.
dc3_crt_skip_nui = true                           	# DC3: auto-nullify NUI/Kinect SDK CRT constructors (indices 75,98-101,210-328). These call unresolved internal NUI functions that corrupt the heap. Set false to disable.
dc3_debug_findarray_override_mode = "off"         	# DC3: debug mode for DataArray::FindArray(Symbol,bool) override (off|log_only|stub_on_fail|null_on_fail|setupfont_fix). 'setupfont_fix' enables an emulated SystemConfig(Symbol,Symbol) probe path that repairs the known Rnd::SetupFont bad 'font' key literal in some decomp builds. Use only for DC3 decomp runtime forensics/progression.
dc3_debug_mempool_alloc_probe = false             	# DC3: log-only probe for MemOrPoolAlloc. Captures caller LR, requested size, file/line/name args, and return value. Detailed logs only on failure or from known crash-path callers.
dc3_debug_read_cache_stream_step_override = false 	# DC3: enable invasive ReadCacheStream step-by-step guest override for DTB debugging. WARNING: performs extra reads/seeks and can perturb checksum/parser behavior; use only in dedicated probe runs.
dc3_game_screen_real_goto = true                  	# DC3: drive loading->game_screen via the real UIManager::GotoScreen (runs game_panel Load()->CreateGame() and the per-frame Poll state machine that creates the Game and sets up dancer anims). Only safe once the song FileMerger merge has completed (gated on merge_busy). Set false to fall back to the old host force-set (no Game created).
dc3_gameplay_probe = false                        	# DC3: enable the host-side GATE PROBE / PKPROBE gameplay diagnostics (reads HamDirector anim state + walks mSongAnims/mPropKeys from the NUI thread). Off by default — it executes guest helper fns each game_screen frame, which perturbs timing. Was used to diagnose the RndPropAnim::GetKeys wrong-receiver hang; keep for recurrence.
dc3_gdb_rsp_break_on_connect = true               	# DC3: pause target execution when a GDB client connects to the headless RSP stub.
dc3_gdb_rsp_host = "127.0.0.1"                    	# DC3: listen host for the headless GDB RSP stub.
dc3_gdb_rsp_port = 9001                           	# DC3: listen port for the headless GDB RSP stub.
dc3_gdb_rsp_prelaunch_sleep_ms = 0                	# DC3: optional sleep before starting the emulator thread (after headless init / RSP stub startup) to allow debugger attach setup.
dc3_gdb_rsp_stub = false                          	# DC3: enable an in-process GDB RSP stub in xenia-headless (Phase 4 MVP).
dc3_guest_overrides = true                        	# DC3: use guest extern overrides for eligible simple NUI/XBC stub-return functions (default cutover path; skips byte patching for registered entries; preserves fake_kinect_data NuiSkeletonGetNextFrame path). The legacy NUI/XBC byte-patch fallback path has been removed; false logs a warning and is ignored for this path.
dc3_ik_telemetry = false                          	# DC3: enable IK telemetry
dc3_nui_enable_signature_resolver = false         	# DC3: enable signature-resolver hook for NUI/XBC patch targets (default on; used by hybrid/strict resolver modes).
dc3_nui_layout_fingerprint_cache_path = ""        	# DC3: optional fingerprint cache file with lines 'original=<hex>' and/or 'decomp=<hex>' for auto layout selection.
dc3_nui_layout_fingerprint_decomp = ""            	# DC3: optional .text FNV1a64 fingerprint (hex) for decomp NUI/XBC patch layout selection in auto mode.
dc3_nui_layout_fingerprint_original = ""          	# DC3: optional .text FNV1a64 fingerprint (hex) for original NUI/XBC patch layout selection in auto mode.
dc3_nui_patch_layout = "auto"                     	# DC3: NUI/XBC patch address layout selector (auto|original|decomp). 'auto' uses the zero-padding heuristic and logs a .text fingerprint for future resolver matching.
dc3_nui_patch_manifest_path = ""                  	# DC3: optional machine-readable DC3 NUI/XBC patch manifest JSON (xenia_dc3_patch_manifest.json). Preferred over symbols.txt when present.
dc3_nui_patch_resolver_mode = "hybrid"            	# DC3: NUI/XBC patch target resolver mode (hybrid|strict). hybrid uses manifest/symbol/signature resolution before catalog fallback; strict disables raw catalog fallback.
dc3_nui_signature_trace = false                   	# DC3: log runtime PPC words for NUI/XBC patch targets at catalog and resolved addresses (debugging signature resolver).
dc3_nui_symbol_map_path = ""                      	# DC3: optional symbol map manifest used by the NUI/XBC resolver (symbols.txt-style 'name = .text:0xADDR;'). If unset, a local dc3-decomp symbols.txt path is auto-probed.
dc3_null_read_cache_stream = false                	# DC3: null read cache
dc3_runtime_telemetry_enable = false              	# DC3: enable structured runtime telemetry (JSONL) for DC3 bring-up analysis and parity tooling.
dc3_runtime_telemetry_include_ppc_words = false   	# DC3: reserved for heavier telemetry payloads (currently unused).
dc3_runtime_telemetry_path = ""                   	# DC3: append-only JSONL telemetry output path. Ignored unless --dc3_runtime_telemetry_enable=true.


[Display]
host_present_from_non_ui_thread = true            	# Allow the GPU emulation thread to present the guest output to the host surface directly instead of requesting the UI thread to do so through the host window system.
present_letterbox = true                          	# Maintain aspect ratio when stretching by displaying bars around the image when there's no more overscan area to crop out.
present_render_pass_clear = true                  	# On graphics backends where this is supported, use the clear render pass load operation in presentation instead of clear commands clearing only the letterbox area.
present_safe_area_x = 90                          	# Percentage of the image width that can be kept when presenting to maintain aspect ratio without letterboxing or stretching.
present_safe_area_y = 90                          	# Percentage of the image height that can be kept when presenting to maintain aspect ratio without letterboxing or stretching.


[GPU]
dc3_inline_render = false                         	# DC3 headless capture: execute draws + resolves INLINE every frame (no deferred-draw recording/replay), so the capture readback reads the frontbuffer the game itself resolved on its own timeline — sidestepping the deferred-replay-reads-stale-guest-memory burst bug. Requires a warm VkPipelineCache (xenia_vulkan_pipeline_cache.bin under --vulkan_pipeline_cache_path, default <temp_directory_path>/xenia-pipeline-cache) to avoid the CP-stall deadlock the deferral was built to dodge. Validation lever (architecture review 2026-06-03).
dc3_persist_render_state = true                   	# DC3 headless capture: keep EDRAM + host render targets persistent across deferred-draw flushes (destructive teardown runs only on the FIRST flush). Fixes the intermittent/partial 3D-scene resolve where the per-flush EDRAM zero-fill + RT-ownership reset wiped source tiles the game expected to persist, so resolves copied zeroed/partial EDRAM (HUD-only or 50%-plateau captures). Set false to restore the old per-flush teardown (menu-transition ghosting prevention).
dc3_replay_depth_disable = false                  	# DC3 headless capture DIAGNOSTIC: clear RB_DEPTHCONTROL.z_enable for every replayed deferred draw, disabling the depth test. If the 3D scene then renders on EVERY captured flush (not just bursts), the burst gate is geometry depth-failing against stale EDRAM depth at replay time. Experiment only — breaks correct occlusion.
depth_float24_convert_in_pixel_shader = false     	# Whether to convert the depth values to 24-bit floating-point (20e4) from the host precision (32-bit floating point) directly in the pixel shaders of guest draws when using a host depth buffer.
                                                  	# This prevents visual artifacts (interleaved stripes of parts of surfaces rendered and parts not rendered, having either the same width in case of the "greater or equal" depth test function, or the former being much thinner than the latter with the "equal" function) if the full host precision depth data is lost.
                                                  	# This issue may happen if the game reloads the depth data previously evicted from the EDRAM to the RAM back to the EDRAM, but the EDRAM region that previously contained that depth buffer was overwritten by another depth buffer, or the game loads it to a different location in the EDRAM than it was previously placed at, thus Xenia is unable to restore the depth data with the original precision, and instead falls back to converting the lower-precision values, so in subsequent rendering passes for the same geometry, the actual depth values of the surfaces don't match those stored in the depth buffer anymore.
                                                  	# This is a costly option because it makes the GPU unable to use depth buffer compression, and also with MSAA, forces the pixel shader to run for every subpixel sample rather than for the entire pixel, making pixel shading 2 or 4 times heavier depending on the MSAA sample count.
                                                  	# The rounding direction is controlled by the depth_float24_round configuration variable.
                                                  	# Note that with depth_float24_round = true, this becomes even more costly because pixel shaders must be executed regardless of whether the surface is behind the previously drawn surfaces. With depth_float24_round = false, conservative depth output is used, however, so depth rejection before the pixel shader may still work.
                                                  	# If sample-rate shading is not supported by the host GPU, the conversion in the pixel shader is done only when MSAA is not used.
                                                  	# When the depth buffer is emulated in software (via the fragment shader interlock / rasterizer-ordered view), this is ignored because 24-bit depth is always used directly.

depth_float24_round = false                       	# Whether to round to the nearest even, rather than truncating (rounding towards zero), the depth when converting it to 24-bit floating-point (20e4) from the host precision (32-bit floating point) when using a host depth buffer.
                                                  	# false:
                                                  	#  Recommended.
                                                  	#  The conversion may move the depth values farther away from the camera.
                                                  	#  Without depth_float24_convert_in_pixel_shader:
                                                  	#   The "greater or equal" depth test function continues to work fine if the full host precision depth data is lost, it's still possible to draw another pass of the same geometry with it.
                                                  	#   (See the description of depth_float24_convert_in_pixel_shader for more information about full precision depth data loss.)
                                                  	#  With depth_float24_convert_in_pixel_shader:
                                                  	#   Faster - the pixel shader for hidden surfaces may still be skipped (using conservative depth output).
                                                  	# true:
                                                  	#  Only for special cases of issues caused by minor 32-bit floating-point rounding errors, for instance, when the game tries to draw something at the camera plane by setting Z of the vertex position to W.
                                                  	#  The conversion may move the depth values closer or farther.
                                                  	#  Using the same rounding mode as in the Direct3D 9 reference rasterizer.
                                                  	#  Without depth_float24_convert_in_pixel_shader:
                                                  	#   Not possible to recover from a full host precision depth data loss - in subsequent passes of rendering the same geometry, half of the samples will be failing the depth test with the "greater or equal" depth test function.
                                                  	#  With depth_float24_convert_in_pixel_shader:
                                                  	#   Slower - depth rejection before the pixel shader is not possible.
                                                  	# When the depth buffer is emulated in software (via the fragment shader interlock / rasterizer-ordered view), this is ignored, and rounding to the nearest even is always done.

depth_transfer_not_equal_test = true              	# When transferring data between depth render targets, use the "not equal" test to avoid writing rewriting depth via shader depth output if it's the same as the one currently in the depth buffer in case of round trips of the data.
                                                  	# Settings this to true may make transfer round trips more friendly to depth compression depending on how the GPU implements it (as arbitrary depth output may result in it being disabled completely), which is beneficial to subsequent rendering, while setting this to false may reduce bandwidth usage during transfers as the previous depth won't need to be read.

draw_resolution_scale_x = 1                       	# Integer pixel width scale used for scaling the rendering resolution opaquely to the game.
                                                  	# 1, 2 and 3 may be supported, but support of anything above 1 depends on the device properties, such as whether it supports sparse binding / tiled resources, the number of virtual address bits per resource, and other factors.
                                                  	# Various effects and parts of game rendering pipelines may work incorrectly as pixels become ambiguous from the game's perspective and because half-pixel offset (which normally doesn't affect coverage when MSAA isn't used) becomes full-pixel.

draw_resolution_scale_y = 1                       	# Integer pixel width scale used for scaling the rendering resolution opaquely to the game.
                                                  	# See draw_resolution_scale_x for more information.

draw_resolution_scaled_texture_offsets = true     	# Apply offsets from texture fetch instructions taking resolution scale into account for render-to-texture, for more correct shadow filtering, bloom, etc., in some cases.
dump_frames_path = ""                             	# Path to dump headless frame captures (PPM format).
dump_shaders = ""                                 	# For shader debugging, path to dump GPU shaders to as they are compiled.
execute_unclipped_draw_vs_on_cpu = true           	# Execute the vertex shader for draws with clipping disabled, primarily screen-space draws (such as clears), on the CPU when possible to estimate the extent of the EDRAM involved in the draw.
                                                  	# Enabling this may significantly improve GPU performance as otherwise up to the entire EDRAM may be considered used in draws without clipping, potentially resulting in spurious EDRAM range ownership transfer round trips between host render targets.
                                                  	# Also, on hosts where certain render target formats have to be emulated in a lossy way (for instance, 16-bit fixed-point via 16-bit floating-point), this prevents corruption of other render targets located after the current ones in the EDRAM by lossy range ownership transfers done for those draws.

execute_unclipped_draw_vs_on_cpu_for_psi_render_backend = true	# If execute_unclipped_draw_vs_on_cpu is enabled, execute the vertex shader for unclipped draws on the CPU even when using the pixel shader interlock (rasterizer-ordered view) implementation of the render backend on the host, for which no expensive copying between host render targets is needed when the ownership of a EDRAM range is changed.
                                                  	# If this is enabled, excessive barriers may be eliminated when switching between different render targets in separate EDRAM locations.

execute_unclipped_draw_vs_on_cpu_with_scissor = false	# Don't restrict the usage of execute_unclipped_draw_vs_on_cpu to only non-scissored draws (with the right and the bottom sides of the scissor rectangle at 8192 or beyond) even though if the scissor rectangle is present, it's usually sufficient for esimating the height of the render target.
                                                  	# Enabling this may cause excessive processing of vertices on the CPU, as some games draw rectangles (for their UI, for instance) without clipping, but with a proper scissor rectangle.

force_all_draws = false                           	# Force all draws to execute even in headless mode. Use with trace replay to render captured GPU traces.
force_convert_line_loops_to_strips = false        	# For host graphics API downlevel support testing only, force CPU conversion of line loops to line strips even if the host supports line loop primitives natively.
force_convert_quad_lists_to_triangle_lists = false	# For host graphics API downlevel support testing only, force CPU conversion of quad lists to quad strips even if the host supports quad list primitives natively or via geometry shader emulation.
                                                  	# May also be useful for graphics debugging when the debugger doesn't display the geometry generated by geometry shaders properly.

force_convert_triangle_fans_to_lists = false      	# For host graphics API downlevel support testing only, force CPU conversion of triangle fans to triangle lists even if the host supports triangle fan primitives natively.
gamma_render_target_as_unorm16 = true             	# When the host can't write 8 bits per component pixels with piecewise linear gamma encoding directly with correct blending, use the 16-bit unsigned normalized format, if supported, for conceptually correct 8_8_8_8_GAMMA render target format blending in linear color space. Greatly increases accuracy for this format, but may result in render target copying costs if the game switches between 8_8_8_8_GAMMA and 8_8_8_8 views for the same EDRAM render target.
gpu = "any"                                       	# Graphics system. Use: [null, vulkan]
gpu_allow_invalid_fetch_constants = false         	# Allow texture and vertex fetch constants with invalid type - generally unsafe because the constant may contain completely invalid values, but may be used to bypass fetch constant type errors in certain games until the real reason why they're invalid is found.
half_pixel_offset = true                          	# Enable support of vertex half-pixel offset (D3D9 PA_SU_VTX_CNTL PIX_CENTER). Generally games are aware of the half-pixel offset, and having this enabled is the correct behavior (disabling this may significantly break post-processing in some games), but in certain games it might have been ignored, resulting in slight blurriness of UI textures, for instance, when they are read between texels rather than at texel centers, or the leftmost/topmost pixels may not be fully covered when MSAA is used with fullscreen passes.
headless_capture_interval = 100                   	# Capture frames every N swaps in headless mode (0 = every frame).
headless_capture_only_draws = true                	# Headless: execute draws and EDRAM copies only on frames the capture logic has marked as render frames, dropping the rest. This is a DC3/RB3DX capture-throughput optimisation, not a correctness requirement — with it true, every headless Vulkan run of every title renders nothing except on capture frames, which silently breaks trace-dump and regression-capture workflows. Set false to render everything headless (upstream-equivalent output at a large throughput cost). --force_all_draws remains a separate per-draw escape hatch.
headless_skip_submission_wait = true              	# Headless: when the CP is asked to await a specific submission, poll for completion instead of blocking on it. Keeps the CP thread responsive to EVENT_WRITE_SHD / WAIT_REG_MEM, which the DC3 and RB3DX headless capture flows deadlock without (~frame 12). UNSOUND for any other headless workflow — notably --gpu=vulkan trace dumps and automated capture of unrelated titles — because buffers and descriptor pools can be recycled while the GPU is still reading them (device-side use-after-free presenting as corruption or a spurious VK_ERROR_DEVICE_LOST). Upstream semantics are false. Defaults true only to preserve this fork's existing DC3/RB3 behaviour; set false for anything else.
headless_verbose_diagnostics = false              	# Enable verbose per-draw and capture diagnostics in headless mode.
ignore_32bit_vertex_index_support = false         	# For host graphics API downlevel testing only (useful only for Qualcomm Adreno 4xx-level host GPU testing), force indirection or pre-masking and pre-swapping of 32-bit vertex indices as if the host only supports 24-bit indices.
mrt_edram_used_range_clamp_to_min = true          	# With host render targets, if multiple render targets are bound, estimate the EDRAM range modified in any of them to be not bigger than the distance between any two render targets in the EDRAM, rather than allowing the last one claim the rest of the EDRAM.
                                                  	# Has effect primarily on draws without viewport clipping.
                                                  	# Setting this to false results in higher accuracy in rare cases, but may increase the amount of copying that needs to be done sometimes.

native_2x_msaa = true                             	# Use host 2x MSAA when available. Can be disabled for scalability testing on host GPU APIs where 2x is not mandatory, in this case, 2 samples of 4x MSAA will be used instead (with similar or worse quality and higher memory usage).
native_stencil_value_output = true                	# Use pixel shader stencil reference output where available for purposes like copying between render targets. Can be disabled for scalability testing, in this case, much more expensive drawing of 8 quads will be done.
non_seamless_cube_map = true                      	# Disable filtering between cube map faces near edges where possible (Vulkan with VK_EXT_non_seamless_cube_map) to reproduce the Direct3D 9 behavior.
primitive_processor_cache_min_indices = 4096      	# Smallest number of guest indices to store in the cache to try reusing later in the same frame if processing (such as primitive type conversion or reset index replacement) is performed.
                                                  	# Setting this to a very high value may result in excessive CPU processing, while a very low value may result in excessive locking and lookups.
                                                  	# Negative values disable caching.

query_occlusion_fake_sample_count = 1000          	# If set to -1 no sample counts are written, games may hang. Else, the sample count of every tile will be incremented on every EVENT_WRITE_ZPD by this number. Setting this to 0 means everything is reported as occluded.
render_target_path_vulkan = ""                    	# Render target emulation path to use on Vulkan.
                                                  	# Use: [any, fbo, fsi]
                                                  	#  fbo:
                                                  	#   Host framebuffers and fixed-function blending and depth / stencil testing, copying between render targets when needed.
                                                  	#   Lower accuracy (limited pixel format support).
                                                  	#   Performance limited primarily by render target layout changes requiring copying, but generally higher.
                                                  	#  fsi:
                                                  	#   Manual pixel packing, blending and depth / stencil testing, with free render target layout changes.
                                                  	#   Requires a GPU supporting fragment shader interlock.
                                                  	#   Highest accuracy (all pixel formats handled in software).
                                                  	#   Performance limited primarily by overdraw.
                                                  	#  Any other value:
                                                  	#   Choose what is considered the most optimal for the system (currently always FB because the FSI path is much slower now).

resolve_resolution_scale_fill_half_pixel_offset = true	# When using resolution scaling, apply the hack that stretches the first surely covered host pixel in the left and top sides of render target resolve areas to eliminate the gap caused by the half-pixel offset (this is necessary for certain games to display the scene graphics).
snorm16_render_target_full_range = true           	# When the host can only support 16_16 and 16_16_16_16 render targets as -1...1, remap -32...32 to -1...1 to use the full possible range of values, at the expense of multiplicative blending correctness.
store_shaders = true                              	# Store shaders persistently and load them when loading games to avoid runtime spikes and freezes when playing the game not for the first time.
texture_cache_memory_limit_hard = 768             	# Maximum host texture memory usage (in megabytes) above which textures will be destroyed as soon as possible.
texture_cache_memory_limit_render_to_texture = 24 	# Part of the host texture memory budget (in megabytes) that will be scaled by the current drawing resolution scale.
                                                  	# If texture_cache_memory_limit_soft, for instance, is 384, and this is 24, it will be assumed that the game will be using roughly 24 MB of render-to-texture (resolve) targets and 384 - 24 = 360 MB of regular textures - so with 2x2 resolution scaling, the soft limit will be 360 + 96 MB, and with 3x3, it will be 360 + 216 MB.

texture_cache_memory_limit_soft = 384             	# Maximum host texture memory usage (in megabytes) above which old textures will be destroyed.
texture_cache_memory_limit_soft_lifetime = 30     	# Seconds a texture should be unused to be considered old enough to be deleted if texture memory usage exceeds texture_cache_memory_limit_soft.
trace_gpu_prefix = "scratch/gpu/"                 	# Prefix path for GPU trace files.
trace_gpu_stream = false                          	# Trace all GPU packets.
vsync = true                                      	# Enable VSYNC.
vulkan_pipeline_cache_path = ""                   	# Directory to persist the VkPipelineCache blob (xenia_vulkan_pipeline_cache.bin) in. Empty = <temp_directory_path>/xenia-pipeline-cache. Warming this cache takes pipeline creation from ~15ms to ~0.1ms and is what the DC3 --dc3_inline_render path needs to avoid its CP-stall deadlock. Before this cvar existed the path was hardcoded to /tmp/claude, which only existed on one bring-up machine.


[General]
debug = false                                     	# Allow debugging and retain debug information.
launch_module = ""                                	# Executable to launch from the .iso or the package instead of default.xex or the module specified by the game. Leave blank to launch the default module.
time_scalar = 1.0                                 	# Scalar used to speed or slow time (1x, 2x, 1/2x, etc).


[HID]
scripted_input = ""                               	# Scripted controller input. Format: '5s:A,7s:START,10s:A'. Simulates a connected controller with timed button presses.
scripted_input_file = ""                          	# Path to a screen-aware input script file. Format:
                                                  	#   wait_screen <name>  -- wait for UIManager.mCurrentScreen
                                                  	#   +<frames> <button>  -- press button N frames after wait
                                                  	#   # comment           -- ignored
                                                  	# Reads the current screen name from guest memory (TheUI at 0x82F1A8E0). Requires --fake_kinect_data=true.

scripted_pad_subtypes = ""                        	# Comma-separated XINPUT_DEVSUBTYPE per scripted pad, e.g. "1,8" = pad0 gamepad, pad1 drums. Empty entries / missing pads default to 1 (XINPUT_DEVSUBTYPE_GAMEPAD). RB3 maps controllers to overshell slots by subtype (6/11=guitar, 8=drums, 15=keytar, 25=pro guitar), and only ONE slot accepts plain gamepads -- two scripted pads can only both join a band if they present as different instrument subtypes.


[Headless]
fake_kinect_data = false                          	# Provide synthetic Kinect skeleton data (T-pose) for DC3. Requires --stub_nui_functions. Enables game to detect a player and progress past the Kinect player detection screen.
headless_report_boot = true                       	# Report boot status to console
headless_timeout_ms = 40000                       	# Timeout in milliseconds before terminating (0 = run indefinitely)
stub_nui_functions = true                         	# Stub NUI (Kinect SDK) functions in guest memory for DC3 debug builds. Writes PPC return-S_OK stubs at known NUI function addresses so the game boots without Kinect hardware.


[Kernel]
autoinit_critical_sections = true                 	# RtlEnterCriticalSection silently initializes a critical section whose dispatch header type != 1 instead of operating on it as-is. This is decomp-support: the DC3 decomp /FORCE-links unresolved extern lock pointers (e.g. gMemLock) and its CRT static-init order lets CritSecTracker call Enter() before MemInit runs, and RB3Enhanced.dll is loaded with call_entry=false so its .bss critical sections are never constructed. For a retail title a type != 1 header more likely means the lock's memory was misread or corrupted, and re-initializing it drops a lock that is genuinely held. Disable to leave such a CS alone (upstream behaviour).
cl = ""                                           	# Specify additional command-line provided to guest.
crt_critical_section_diagnostics = false          	# Log diagnostic info for RtlEnterCriticalSection calls to detect uninitialized or deadlocked critical sections during CRT init.
headless_thread_diagnostics = true                	# Enable verbose main-thread wait/delay diagnostics in headless mode.
ignore_thread_affinities = true                   	# Ignores game-specified thread affinities.
ignore_thread_priorities = true                   	# Ignores game-specified thread priorities.
io_force_synchronous_completion = true            	# NtReadFile/NtReadFileScatter/NtWriteFile always complete the transfer before returning; with this enabled they also suppress the STATUS_PENDING return upstream produced for files opened for asynchronous IO. Required by the XAPILIB ReadFile wrapper, which sets OVERLAPPED.Internal = STATUS_PENDING before the syscall and passes a separate stack IO_STATUS_BLOCK -- if we return PENDING, its GetOverlappedResult never observes completion and spins forever (this is what stalled the DC3 decomp in AsyncFile::Read -> AsyncFileWin::_ReadDone). Disable to restore the upstream STATUS_PENDING return for non-synchronous files; the transfer still completes eagerly and the caller's IO_STATUS_BLOCK still receives the final status.
kernel_cert_monitor = false                       	# Enable cert monitor.
kernel_debug_monitor = false                      	# Enable debug monitor.
kernel_display_gamma_power = 2.22222233           	# Display gamma to use with kernel_display_gamma_type 3.
kernel_display_gamma_type = 2                     	# Display gamma type: 0 - linear, 1 - sRGB (CRT), 2 - BT.709 (HDTV), 3 - power specified via kernel_display_gamma_power.
kernel_pix = false                                	# Enable PIX.
kernel_stack_walk_frames = 64                     	# Maximum number of guest stack frames any cvar-gated kernel diagnostic will walk. Guest stack walks read guest memory from inside a kernel shim; each frame is bounds- and commit-checked, but a deep walk still costs one heap lookup per frame.
local_user_count = 1                              	# Number of fake signed-in local user profiles (1-4). Users beyond index 0 are synthesized with a stable offline XUID and a Player{N} gamertag so local multiplayer (e.g. join on a second controller) sees a valid signed-in profile.
log_high_frequency_kernel_calls = false           	# Log kernel calls with the kHighFrequency tag.
rb3_overlapped_writeback = false                  	# On synchronous NtReadFile/NtReadFileScatter completion, also mirror the final status/byte-count into the guest OVERLAPPED reached via ApcContext (kernel32/XAPILIB async-ReadFile convention: ApcContext = lpOverlapped). RB3/DC3's AsyncFileWin::_ReadDone polls OVERLAPPED.Internal directly (hEvent=0, no GetOverlappedResult wait) and spins while it reads STATUS_PENDING (0x103). When the title's XAPILIB hands NtReadFile a SEPARATE IO_STATUS_BLOCK, writing io_status_block never clears the guest OVERLAPPED, so the loader freezes forever. This clears it. Only fires when there is no real APC routine (pure overlapped-async path). Off by default; DC3 boot bar is measured with it off.
rb3_trace_shutdown = false                        	# RB3 boot-to-menu diagnostic: on NtSetEvent for the shutdown-decision event (handle 0xF80000EC), log the calling guest LR plus a shallow guest-stack return-address walk to locate the title-exit decision site. Default OFF (inert for DC3 and all non-diagnostic runs).
rtl_leave_critical_section_force_release = true   	# RtlLeaveCriticalSection repairs guest lock state when the caller is not the recorded owner (rewrites owning_thread) or when recursion_count is already <= 0 (clamps to 1), then releases. Both are demotions of Checked-build asserts, but unlike a plain demotion they MUTATE guest state, so a detectable double-unlock becomes a corrupted lock. Both our titles reach these paths (DC3 boot logs record one ownership mismatch -- docs/dc3-boot/STATUS.md; RB3Enhanced.dll's unconstructed .bss critical sections hit the same family, see b77f0fa27), so it defaults on. Disable to log and return without touching the lock, which is what upstream's Release build effectively did before the repair was added.
xex_apply_patches = true                          	# Apply XEX patches.
xnet_random_constant_fill = false                 	# Fill XNetRandom output with constant 0xBB bytes (the historical xenia stub behavior) instead of real entropy. Only useful to replicate old runs; constant fill collapses every XNetRandom-derived identity/guid to the same value (e.g. Rock Band 3 player guids -- second local player can never own a part).


[Logging]
flush_log = true                                  	# Flush log file after each log line batch.
log_file = ""                                     	# Logs are written to the given file
log_level = 2                                     	# Maximum level to be logged. (0=error, 1=warning, 2=info, 3=debug)
log_string_format_kernel_calls = false            	# Log kernel calls with the kHighFrequency tag.
log_to_debugprint = false                         	# Dump the log to DebugPrint.
log_to_stdout = true                              	# Write log output to stdout


[Memory]
posix_allocfixed_zero_commit = true               	# Zero guest pages on the transition to committed, matching console NtAllocateVirtualMemory and Windows VirtualAlloc(MEM_COMMIT). Only does work on POSIX, where xe::memory::AllocFixed mprotects an existing file-backed mapping instead of mmap'ing fresh anonymous pages (it has to -- see the comment in base/memory_posix.cc) and therefore cannot zero. Without this, a guest commit returns whatever the previous tenant left behind. Turn it off to get the pre-2026-08 fork behavior back if a title regresses.
protect_on_release = false                        	# Protect released memory to prevent accesses.
protect_zero = true                               	# Protect the zero page from reads and writes.
rb3dx_force_zero_commit = true                    	# RB3 Deluxe: force-zero all guest memory commits (virtual + physical) to match console zeroed-page semantics. Title-gated to RB3DX; inert for other titles. Did NOT fix the title OOM; off by default.
scribble_heap = false                             	# Scribble 0xCD into all allocated heap memory.
writable_executable_memory = true                 	# Allow mapping memory with both write and execute access, for simulating behavior on platforms where that's not supported


[RB3]
rb3_mount_update = false                          	# RB3 boot-to-menu experiment: mount update: at the disc dir so RB3 finds update:\gen\patch_xbox.hdr (title-update content). Default OFF (inert for DC3 and normal runs).


[Storage]
cache_root = ""                                   	# Root path for files used to speed up certain parts of the emulator or the game. These files may be persistent, but they can be deleted without major side effects such as progress loss. If empty, the cache folder under the storage root, or, if available, the cache directory preferred for the OS, will be used.
content_root = ""                                 	# Root path for guest content storage (saves, etc.), or empty to use the content folder under the storage root.
devkit_root = ""                                  	# Optional host path to mount as devkit:. Useful for debug XEX overlay files such as locale_keep.dta.
mount_cache = false                               	# Enable cache mount
mount_scratch = false                             	# Enable scratch mount
storage_root = ""                                 	# Root path for persistent internal data storage (config, etc.), or empty to use the path preferred for the OS, such as the documents folder, or the emulator executable directory if portable.txt is present in it.


[UI]
headless = false                                  	# Don't display any UI, using defaults for prompts as needed.
profiler_dpi_scaling = false                      	# Apply window DPI scaling to the profiler.
show_profiler = false                             	# Show profiling UI by default.


[Vulkan]
vulkan_allow_present_mode_fifo_relaxed = true     	# When available, allow the relaxed first-in-first-out presentation mode (3rd priority), which causes waiting for host display vertical sync, but may present with tearing if frames don't meet the host display refresh rate.
vulkan_allow_present_mode_immediate = true        	# When available, allow the immediate presentation mode (1st priority), offering the lowest latency with the possibility of tearing in certain cases, and, depending on the configuration, variable refresh rate.
vulkan_allow_present_mode_mailbox = true          	# When available, allow the mailbox presentation mode (2nd priority), offering low latency without the possibility of tearing.
vulkan_device = -1                                	# Index of the preferred Vulkan physical device, or -1 to use any compatible device.
vulkan_log_debug_messages = true                  	# Write Vulkan VK_EXT_debug_utils messages to the Xenia log, as opposed to the OS debug output.
vulkan_sparse_shared_memory = true                	# Enable sparse binding for shared memory emulation. Disabling it increases video memory usage - a 512 MB buffer is created - but allows graphics debuggers that don't support sparse binding to work.
vulkan_validation = false                         	# Enable the Vulkan validation layer (VK_LAYER_KHRONOS_validation). Messages will be written to the Xenia log if 'vulkan_log_debug_messages' is enabled, or to the OS debug output otherwise.


